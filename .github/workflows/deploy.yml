# Build and deploy the blog to Cloudflare Pages on every push to main.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   Account > Cloudflare Pages: Edit
#   CLOUDFLARE_ACCOUNT_ID

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-blog
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a commit SHA, not a tag. Tags are mutable, and this job holds
      # a Cloudflare deploy token.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: "22"
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile says and fails if the lockfile is out of step with
      # package.json, instead of quietly resolving something different from
      # what was tested locally.
      - name: Install dependencies
        run: npm ci

      # The content schema is enforced here. A post with a missing title or a
      # malformed date fails the build rather than deploying broken.
      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.120.1 pages deploy dist \
            --project-name=pacestreak-blog \
            --branch=main \
            --commit-dirty=true

      # A successful upload is not the same as a working site.
      - name: Verify the live site
        run: |
          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -m 20 -w '%{http_code}' https://blog.pacestreak.com/ || echo 000)
            feed=$(curl -sS -o /dev/null -m 20 -w '%{http_code}' https://blog.pacestreak.com/rss.xml || echo 000)
            echo "attempt $i: page=$code rss=$feed"
            if [ "$code" = "200" ] && [ "$feed" = "200" ]; then
              echo "blog healthy"
              exit 0
            fi
            sleep 15
          done
          echo "::error::blog did not come back healthy after deploy"
          exit 1
